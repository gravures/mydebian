#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json
blacklist = ["scratch"]
dir_length = 1
cache = false

# [[wildcard]]
# pattern = "~/DEVELOPPEMENT/REPOS/*"
# startup_command = "tmux split-pane -h; tmux split-pane -v"
# preview_command = "lsd --tree --depth 3 {}"

[default_session]
startup_command = "tmux split-pane -h; tmux split-pane -v; tmux next; clear; hx"
preview_command = "lsd --tree --depth 3 {}"

[[session]]
name = "standard-deluxe"
path = "~/DEVELOPPEMENT/REPOS/standard-deluxe"
preview_command = "sh -c uname -a"

[[session]]
name = "tmux"
path = "~/.config/tmux"
startup_command = "hx tmux.conf"
preview_command = "bat --color=always ~/.config/tmux/tmux"
